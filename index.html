<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atomic Features</title>
<style>
  :root{--ink:#2b2140; --soft:#6b6580; --faint:#b0a9c2; --card:#ffffff; --line:#e7e0f5;
    --purple:#6b4fd0; --shadow:0 10px 30px rgba(70,50,120,.12)}
  *{box-sizing:border-box}
  body{
    margin:0; padding:28px 16px 64px;
    font-family:ui-rounded,"Segoe UI",Nunito,system-ui,sans-serif;
    color:var(--ink);
    background:linear-gradient(160deg,#fff4e6 0%,#ffe9f3 45%,#e9f0ff 100%);
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:560px; margin:0 auto}
  h1{font-size:32px; line-height:1.15; text-align:center; margin:8px 0 6px; font-weight:800; letter-spacing:-.5px}
  .sub{text-align:center; color:var(--soft); font-size:16px; margin:0 0 22px}
  .search{width:100%; font-size:17px; padding:14px 16px; border-radius:16px; border:2px solid var(--line);
    background:#fff; color:var(--ink); box-shadow:var(--shadow); margin:0; outline:none; font-family:inherit}
  .search:focus{border-color:#bfa8f0}
  .count{text-align:center; color:var(--soft); font-size:14px; margin:10px 0 12px}
  a.card{display:flex; align-items:center; gap:16px; text-decoration:none; color:inherit;
    background:var(--card); border-radius:22px; padding:20px 20px; box-shadow:var(--shadow); margin:12px 0}
  a.card:active{transform:scale(.99)}
  .emoji{font-size:40px; line-height:1; flex:0 0 auto}
  .big{font-size:18px; font-weight:800; margin:0}
  .say{font-size:14.5px; color:var(--soft); margin:4px 0 0; line-height:1.4}
  .meta{display:flex; align-items:center; gap:8px; margin:7px 0 0}
  .date{font-size:12.5px; color:var(--faint)}
  .status{font-size:11px; font-weight:800; letter-spacing:1px; text-transform:uppercase;
    padding:3px 9px; border-radius:999px; background:#eaffef; color:#1e8f5a}
  .status.done{background:#f3f0ff; color:var(--soft)}
  .issue{font-size:12.5px; color:var(--purple); font-weight:700}
  .empty{text-align:center; color:var(--soft); font-size:16px; margin:24px 0}
  .foot{text-align:center; color:var(--soft); font-size:13.5px; margin-top:26px}
</style>
</head>
<body>
<div class="wrap">

  <h1>Atomic Features ⚛️</h1>
  <p class="sub">one feature &rarr; smallest atoms &rarr; ready for parallel build</p>

  <input id="q" class="search" type="search" placeholder="Search atomic features&hellip;" autocomplete="off" aria-label="Search atomic features">
  <p id="count" class="count">Loading&hellip;</p>
  <div id="list"></div>
  <p id="empty" class="empty">No matches. Try another word.</p>

  <p class="foot">every map breaks one feature into atoms a team can build in parallel</p>

</div>

<script>
  var listEl = document.getElementById('list');
  var qEl = document.getElementById('q');
  var countEl = document.getElementById('count');
  var emptyEl = document.getElementById('empty');
  var pages = [];

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
    });
  }

  function render(items){
    listEl.innerHTML = items.map(function(p){
      var done = String(p.status || 'open') === 'done';
      return '<a class="card" href="' + encodeURI(p.file) + '">' +
        '<span class="emoji">' + (p.emoji || '\ud83e\udde0') + '</span>' +
        '<span><p class="big">' + esc(p.title) + '</p>' +
        '<p class="say">' + esc(p.desc || '') + '</p>' +
        '<span class="meta"><span class="status' + (done ? ' done' : '') + '">' + (done ? 'done' : 'open') + '</span>' +
        '<span class="date">' + esc(p.date || '') + '</span>' +
        (p.issue ? '<span class="issue">issue ' + esc(p.issue) + '</span>' : '') +
        '</span></span></a>';
    }).join('');
    countEl.textContent = items.length + ' of ' + pages.length +
      ' idea' + (pages.length === 1 ? '' : 's');
    emptyEl.hidden = items.length > 0;
  }

  function applyFilter(){
    var q = qEl.value.trim().toLowerCase();
    var items = !q ? pages : pages.filter(function(p){
      return (p.title + ' ' + (p.desc || '')).toLowerCase().indexOf(q) !== -1;
    });
    render(items);
  }

  fetch('pages.json', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(d){
      pages = d.slice().sort(function(a, b){
        return String(b.date || '').localeCompare(String(a.date || ''));
      });
      render(pages);
    })
    .catch(function(){ countEl.textContent = 'Could not load the list.'; });

  qEl.addEventListener('input', applyFilter);
</script>
</body>
</html>
