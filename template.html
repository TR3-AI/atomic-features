<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}} — atomic features</title>
<style>
  :root {
    --ink: #17202b;
    --soft: #51606f;
    --faint: #8fa0b3;
    --paper: #eef2f6;
    --box: #ffffff;
    --blue: #2456a6;
    --blue-soft: #dbe7f8;
    --teal: #0f766e;
    --teal-soft: #e0f2ef;
    --red: #c2374a;
    --line: #c8d4e0;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    margin: 0; padding: 24px 14px 64px;
    font-family: "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background:
      linear-gradient(var(--paper), var(--paper)),
      repeating-linear-gradient(0deg, transparent 0 23px, rgba(36,86,166,.06) 23px 24px),
      repeating-linear-gradient(90deg, transparent 0 23px, rgba(36,86,166,.06) 23px 24px);
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; }

  header.page { text-align: center; margin-bottom: 30px; }
  header.page h1 {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 26px; font-weight: 800; letter-spacing: -.5px;
  }
  header.page .sub { color: var(--soft); margin-top: 6px; font-size: 14.5px; }
  header.page .sub a { color: var(--blue); font-weight: 700; }
  header.page .stamp {
    display: inline-block; margin-top: 10px; font-family: ui-monospace, Menlo, monospace;
    font-size: 11.5px; color: var(--faint); border: 1px solid var(--line);
    padding: 4px 12px; border-radius: 4px; background: var(--box);
  }

  /* ── stats bar ───────────────────────────────────── */
  .stats { display: flex; justify-content: center; gap: 8px; margin-bottom: 22px; flex-wrap: wrap; }
  .stat {
    background: var(--box); border: 1.5px solid var(--blue); border-radius: 6px;
    padding: 4px 12px; text-align: center; box-shadow: 0 4px 12px rgba(23, 32, 43, .06);
    display: flex; align-items: baseline; gap: 6px;
  }
  .stat .snum {
    font-family: ui-monospace, Menlo, monospace;
    font-size: 15px; font-weight: 800; color: var(--blue);
  }
  .stat .slbl {
    font-size: 10px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; color: var(--soft);
  }

  /* sub-feature chips */
  .subs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 10px; }
  .sub {
    background: var(--blue-soft); border: 1.5px solid var(--blue); border-radius: 6px;
    padding: 4px 10px; font-size: 12.5px;
  }
  .sub b { font-family: ui-monospace, Menlo, monospace; color: var(--blue); }

  /* verification: reach / preconditions / drive steps / gotchas */
  .vreach { font-size: 14px; line-height: 1.55; margin: 0 0 10px 22px; }
  .vreach li { margin: 4px 0; }
  .vreach li::marker { color: var(--teal); }
  .pre {
    font-family: ui-monospace, Menlo, monospace; font-size: 12px; color: var(--soft);
    background: var(--paper); border-radius: 6px; padding: 8px 12px; margin-bottom: 8px;
  }
  .vbox ol.fsteps b, .vreach b { color: var(--blue); }
  .vbox code, .vreach code {
    font-family: ui-monospace, Menlo, monospace; font-size: 12.5px;
    background: var(--blue-soft); border-radius: 4px; padding: 1px 5px;
  }
  .gotcha {
    background: #fdf6e8; border-left: 4px solid #9a6a00; border-radius: 0 6px 6px 0;
    padding: 8px 12px; margin: 6px 0; font-size: 13.5px; line-height: 1.5;
  }

  /* ── feature box ─────────────────────────────────── */
  .fbox {
    background: var(--box); border: 2px solid var(--blue); border-radius: 8px;
    overflow: hidden; box-shadow: 0 6px 18px rgba(23, 32, 43, .08);
  }
  .fhead {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap;
    background: var(--blue); color: #fff; padding: 12px 16px;
  }
  .fhead .fnum {
    font-family: ui-monospace, Menlo, monospace; font-size: 12px; font-weight: 700;
    background: rgba(255,255,255,.18); border-radius: 4px; padding: 2px 8px;
  }
  .fhead h3 { font-size: 18px; font-weight: 800; }
  .fhead .fdept {
    margin-left: auto; font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 1px; opacity: .85;
  }
  .fsec { padding: 14px 16px 6px; }
  .fsec + .fsec { border-top: 1px dashed var(--line); }
  .flbl {
    font-family: ui-monospace, Menlo, monospace; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--blue); margin-bottom: 8px;
  }
  ol.fsteps, ul.fbeh { margin: 0 0 10px 22px; font-size: 14.5px; line-height: 1.55; }
  ol.fsteps li, ul.fbeh li { margin: 5px 0; }
  ol.fsteps li::marker { color: var(--blue); font-weight: 800; font-family: ui-monospace, Menlo, monospace; }
  ul.fbeh li::marker { color: var(--blue); }
  .fsteps b, .fbeh b { color: var(--blue); }

  /* stepped flow (legacy, unused by atom cards) */
  .fvflow { margin: 2px 0 12px; }
  .fvstep {
    position: relative; margin: 0 0 4px 14px; padding: 8px 12px 8px 14px;
    background: var(--blue-soft); border-left: 3px solid var(--blue);
    border-radius: 0 6px 6px 0; font-size: 14px; line-height: 1.45;
  }
  .fvstep::before {
    content: ""; position: absolute; left: -9px; top: 100%; height: 8px;
    border-left: 2px solid var(--blue);
  }
  .fvstep:last-child::before { display: none; }
  .fvstep.trig { background: #e8ecff; border-left-color: #4a3fb0; }
  .fvstep.trig b { color: #4a3fb0; }
  .fvstep.end { background: #fdeef0; border-left-color: var(--red); }
  .fvstep.end b { color: var(--red); }
  .fvstep .tag {
    font-family: ui-monospace, Menlo, monospace; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1px; color: var(--soft); margin-right: 6px;
  }

  /* ── connector ───────────────────────────────────── */
  .vlink { position: relative; height: 44px; margin: 0 auto; width: 0; border-left: 2px solid var(--teal); }
  .vlink::after {
    content: "▼"; position: absolute; left: -7px; bottom: -4px;
    color: var(--teal); font-size: 12px;
  }
  .vlink .vlab {
    position: absolute; left: 10px; top: 12px; white-space: nowrap;
    font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 1.5px; color: var(--teal);
    background: var(--paper); padding: 2px 8px; border: 1px solid var(--teal); border-radius: 4px;
  }

  /* ── verification box ────────────────────────────── */
  .vbox {
    background: var(--teal-soft); border: 2px solid var(--teal); border-radius: 8px;
    padding: 14px 16px; margin-bottom: 34px; box-shadow: 0 6px 18px rgba(23, 32, 43, .06);
  }
  .vbox .flbl { color: var(--teal); }
  .vbox .vactor {
    font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; font-weight: 700;
    letter-spacing: .5px; color: var(--teal); opacity: .8; margin: -2px 0 8px;
  }
  .vbox ol.fsteps li::marker { color: var(--teal); }
  .verdict {
    border-radius: 6px; padding: 10px 14px; margin: 8px 0 2px; font-size: 14px; line-height: 1.5;
    background: var(--box);
  }
  .verdict span {
    display: block; font-family: ui-monospace, Menlo, monospace; font-size: 10.5px;
    font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 3px;
  }
  .verdict.ok { border-left: 4px solid var(--teal); }
  .verdict.ok span { color: var(--teal); }
  .verdict.bad { border-left: 4px solid var(--red); }
  .verdict.bad span { color: var(--red); }

  /* ── test stream ─────────────────────────────────── */
  .tunit { border-top: 1.5px dashed rgba(23, 32, 43, .14); padding: 10px 0 6px; }
  .thead { display: flex; align-items: baseline; gap: 7px; font-weight: 800; font-size: 14px; }
  .tnum {
    font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; font-weight: 800;
    color: #fff; background: var(--teal); border-radius: 4px; padding: 1px 6px;
  }
  .tbody { font-size: 13.5px; line-height: 1.55; margin: 4px 0 6px; }
  .tunit .verdict { padding: 7px 12px; margin: 5px 0 2px; font-size: 13.5px; }

  /* ── research disagreements strip ────────────────── */
  .rnotes {
    background: #fdf6e8; border: 2px solid #c9930a; border-radius: 8px;
    padding: 14px 16px; margin-bottom: 26px; box-shadow: 0 6px 18px rgba(23, 32, 43, .06);
  }
  .rnhead { font-weight: 800; font-size: 14.5px; color: #7a5800; margin-bottom: 8px; }
  .rnsub { font-size: 12.5px; color: #7a5800; opacity: .85; margin-bottom: 10px; }
  .rnote {
    background: #fff; border-left: 4px solid #c9930a; border-radius: 0 6px 6px 0;
    padding: 8px 12px; margin: 6px 0; font-size: 13.5px; line-height: 1.5;
  }
  .rnote b { color: #7a5800; }
  .tact {
    display: block; background: #eaf6f1; border-left: 4px solid var(--teal);
    border-radius: 0 6px 6px 0; padding: 7px 12px; margin-top: 6px; font-size: 13px;
  }
  .tact b {
    font-family: ui-monospace, Menlo, monospace; font-size: 10.5px; font-weight: 800;
    text-transform: uppercase; letter-spacing: 1px; color: var(--teal); margin-right: 6px;
  }

  footer { text-align: center; color: var(--soft); font-size: 13px; margin-top: 44px; }
  footer a { color: var(--blue); font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<div class="wrap">

  <header class="page">
    <h1>{{TITLE}}</h1>
    <div class="sub">atomic features · broken from {{SOURCE_LABEL}}</div>
    <div class="stamp">{{COUNT}} · updated {{UPDATED}}</div>
  </header>

  {{STATS}}

  {{FEATURES}}

  {{RESEARCH}}

  <footer>Atomic Features — one feature, broken into atoms a team can build in parallel{{KIT_FOOT}} · <a href="index.html">all atomic features</a></footer>

</div>
<script src="nav.js" defer></script>
</body>
</html>
